<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stego Magic</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: #f5f7fa; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #fff; max-width: 600px; width: 100%; border-radius: 12px; box-shadow: 0 12px 24px rgba(0,0,0,0.08); padding: 30px; display: flex; flex-direction: column; gap: 20px; transition: 0.3s; }
    .container:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.12); }
    h1 { text-align: center; font-weight: 700; color: #4b6cb7; background: linear-gradient(90deg, #4b6cb7, #182848); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2rem; }
    
    /* Tab Slider */
    .tabs { display: flex; border-radius: 10px; overflow: hidden; border: 1px solid #ccc; }
    .tab { flex: 1; text-align: center; padding: 12px 0; cursor: pointer; background: #f1f3f6; font-weight: 600; transition: 0.3s; }
    .tab.active { background: #4b6cb7; color: #fff; }

    label { font-weight: 600; margin-bottom: 6px; display: block; }
    input[type="text"], input[type="password"], textarea { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; transition: 0.2s; }
    input[type="text"]:focus, input[type="password"]:focus, textarea:focus { border-color: #4b6cb7; outline: none; box-shadow: 0 0 0 3px rgba(75,108,183,0.15); }

    button { background: #4b6cb7; color: #fff; font-weight: 600; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95rem; transition: 0.3s; }
    button:hover { background: #182848; }

    .output-container { position: relative; }
    .output { background: #f1f3f6; padding: 15px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; word-wrap: break-word; min-height: 60px; }
    .copy-btn { position: absolute; right: 10px; top: 10px; background: #4b6cb7; border: none; color: #fff; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: 0.3s; }
    .copy-btn:hover { background: #182848; }

    .section { display: none; flex-direction: column; gap: 15px; }
    .section.active { display: flex; }

    @media (max-width: 500px) { .container { padding: 20px; } h1 { font-size: 1.6rem; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Stego Magic</h1>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('encode')">Encode</div>
      <div class="tab" onclick="switchTab('decode')">Decode</div>
    </div>

    <!-- Encode Section -->
    <div class="section active" id="encode-section">
      <div>
        <label for="carrier-encode">Carrier Text</label>
        <input type="text" id="carrier-encode" placeholder="Enter visible text">
      </div>

      <div>
        <label for="hidden-encode">Hidden Text</label>
        <textarea id="hidden-encode" rows="3" placeholder="Enter secret text"></textarea>
      </div>

      <div>
        <label for="key-encode">Encryption Key (Optional)</label>
        <input type="password" id="key-encode" placeholder="Enter encryption key (optional)">
      </div>

      <button onclick="encodeText()">Encode</button>
    </div>

    <!-- Decode Section -->
    <div class="section" id="decode-section">
      <div>
        <label for="carrier-decode">Encoded Text</label>
        <textarea id="carrier-decode" rows="3" placeholder="Paste encoded text"></textarea>
      </div>

      <div>
        <label for="key-decode">Encryption Key (Optional)</label>
        <input type="password" id="key-decode" placeholder="Enter encryption key (optional)">
      </div>

      <button onclick="decodeText()">Decode</button>
    </div>

    <div class="output-container">
      <label>Output</label>
      <div class="output" id="output"></div>
      <button class="copy-btn" onclick="copyOutput()">Copy</button>
    </div>
  </div>

  <!-- Main JS -->
  <script src="main.js"></script>
  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      if(tab === 'encode') {
        document.querySelector('.tab:nth-child(1)').classList.add('active');
        document.getElementById('encode-section').classList.add('active');
      } else {
        document.querySelector('.tab:nth-child(2)').classList.add('active');
        document.getElementById('decode-section').classList.add('active');
      }
      document.getElementById('output').textContent = '';
    }

    async function encodeText() {
      const carrier = document.getElementById('carrier-encode').value;
      const hidden = document.getElementById('hidden-encode').value;
      const key = document.getElementById('key-encode').value;
      try {
        const encoded = await encode(carrier, hidden, key);
        document.getElementById('output').textContent = encoded;
      } catch(err) {
        document.getElementById('output').textContent = "Error: " + err.message;
      }
    }

    async function decodeText() {
      const carrier = document.getElementById('carrier-decode').value;
      const key = document.getElementById('key-decode').value;
      try {
        const decoded = await decode(carrier, key);
        document.getElementById('output').textContent = decoded;
      } catch(err) {
        document.getElementById('output').textContent = "Error: " + err.message;
      }
    }

    function copyOutput() {
      const text = document.getElementById('output').textContent;
      navigator.clipboard.writeText(text).then(() => {
        null
      });
    }
  </script>
</body>
</html>
